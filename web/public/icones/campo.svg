<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    Icone do app de campo: o simbolo da Marca (components/shell/marca.tsx) sozinho,
    sem texto, no fundo do tema escuro. A faixa de dominio vista de cima: duas
    linhas de asfalto, o eixo tracejado entre elas e, na margem de baixo, o filete
    de limao, unico elemento colorido — a vegetacao, que e o que o produto vigia.

    Os tracos vem do viewBox 24x24 original, ampliados por 19 e centralizados
    contando as pontas arredondadas (que avancam meia espessura alem de cada
    extremo). A margem de 12% da versao maskable e aplicada por gerar-icones.mjs,
    reduzindo este mesmo desenho — por isso aqui ele ocupa a arte toda.
  -->
  <rect width="512" height="512" fill="#0a0d0c"/>
  <g transform="translate(29.2 0.675) scale(19)" fill="none" stroke-linecap="round">
    <!-- Asfalto: as duas bordas da pista. -->
    <path d="M2.5 7.5h19M2.5 14h19" stroke="#f7f7f4" stroke-width="1.75"/>
    <!-- Eixo tracejado: recessivo, e o miolo da pista. -->
    <path d="M4.5 10.75h3.5M11 10.75h2.5M16.5 10.75h3.5" stroke="#f7f7f4" stroke-width="1.25" opacity="0.4"/>
    <!-- Margem com vegetacao: o filete de acento, sempre mais curto que a pista. -->
    <path d="M2.5 19.25h13" stroke="#a3e635" stroke-width="2"/>
  </g>
</svg>
