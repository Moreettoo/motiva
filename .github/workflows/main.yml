name: Reanalise

# O nome da execucao carrega o id do trecho porque `workflow_dispatch` responde
# 204 sem corpo: nao ha id de execucao na resposta, e o painel precisa achar a
# execucao que acabou de criar para acompanhar o progresso.
run-name: >-
  ${{ inputs.trecho_id != '' && format('Reanalise · trecho {0}', inputs.trecho_id) || 'Reanalise da malha' }}

on:
  schedule:
    - cron: "0 9 * * *"     # 06:00 de Brasilia (09:00 UTC)
  workflow_dispatch:
    inputs:
      trecho_id:
        description: "Id de um trecho para reanalisar so ele. Vazio = malha inteira."
        required: false
        type: string
        default: ""

# Uma execucao por vez: duas reanalises simultaneas escreveriam previsoes
# concorrentes para o mesmo trecho, e a view desempata por id — a ultima a
# inserir venceria por acaso, nao por ser a mais correta.
concurrency:
  group: reanalise
  cancel-in-progress: false

jobs:
  reanalisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar analise
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          DB_SCHEMA:            ia
          OPENAI_MODEL:         gpt-5.4-mini
          LIMIAR_DIAS:          "45"
          TRECHO_ID:            ${{ inputs.trecho_id }}
        run: python analisar_lote.py
